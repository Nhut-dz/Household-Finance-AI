# Cấu hình mặc định (env override qua HFML_*). Xem src/hfml/config.py.
# Ngưỡng của tầng rule nằm ở config/rules.yaml, không phải ở đây.

random_seed: 42

# max(predict_proba) dưới ngưỡng này → hạ cấp xuống kết luận rule,
# đánh dấu low_confidence: true trong structured result (PLAN.md §8.1).
confidence_threshold: 0.60

# Nguồn dữ liệu nghiệp vụ: PostgreSQL Household_Finance_V2_Dev (pgAdmin 4).
# Password KHÔNG để ở đây — đặt trong .env qua HFML_DB_PASSWORD.
# Server dev local trust auth nên password rỗng vẫn kết nối được.
database:
  host: 127.0.0.1
  port: 5432
  name: Household_Finance_V2_Dev
  user: postgres

training:
  # Task 5 — chia ba: train 70% · validation 15% · test 15%.
  # train suy ra từ phần còn lại, không khai riêng để ba số khỏi lệch tổng.
  #
  # KHÔNG có `n_splits`: ML01 không dùng K-Fold Cross-Validation (chốt
  # 14/08/2026). Model được chọn theo macro-F1 trên tập validation.
  val_size: 0.15
  test_size: 0.15

logging:
  level: INFO           # DEBUG khi cần soi; override bằng HFML_LOG_LEVEL
  console: true
  file: logs/hfml.log   # xoay vòng 5 MB × 3 file, UTF-8

# Runtime của module inference (Epic AI-03). Đọc bởi hfml/inference/settings.py.
# Mọi biến ở đây đều có env override tương ứng (HFML_*) để đổi khi vận hành mà
# không phải sửa file.
inference:
  # Artifact đang phục vụ. Đổi model = đổi hai dòng này, không sửa mã nguồn.
  # HFML_ML01_SLUG / HFML_ML02_SLUG
  ml01_slug: ml01_xgboost_vfinal
  ml02_slug: ml02_xgboost_reduced_vfinal

  # null = dùng ngưỡng đã chốt trong artifact (0.1303, F04 task 14) — đúng thứ
  # đã được đánh giá trên tập validation. Đặt số ở đây là CHỦ ĐỘNG đánh đổi
  # precision/recall so với báo cáo đánh giá, nên nó được log ở mức WARNING.
  ml02_threshold: null

  # Số lượt hội thoại gần nhất đưa vào context LLM.
  history_turns: 3
  # Số lần gọi lại LLM khi câu trả lời không qua kiểm.
  llm_max_retries: 1

llm:
  model: gemini-3.6-flash
  # 4000 chứ không phải 1500. Đo được trên một lượt thật: câu trả lời JSON
  # tiếng Việt tốn ~640 token đầu ra, NHƯNG model còn dùng ~2150 token suy
  # luận và cả hai cùng tính vào hạn mức này. Đặt 1500 thì mọi lượt gọi đều
  # dừng ở FinishReason.MAX_TOKENS, JSON bị cắt giữa chừng, và hệ thống lặng
  # lẽ hạ cấp về template — trông y hệt như chưa cấu hình API key.
  max_tokens: 4000
  # Nhiệt độ thấp: tầng llm chỉ diễn đạt lại JSON, không cần sáng tạo.
  temperature: 0.3

  # Giới hạn thời gian MỘT lượt gọi Gemini (giây). Hết giờ thì coi như không
  # gọi được và hạ cấp về câu dựng sẵn.
  #
  # Có con số này vì SDK google-genai mặc định tự thử lại có backoff khi gặp
  # 429/5xx, và chuỗi thử lại đó từng kéo một lượt `/advise` vượt hẳn 30 giây
  # mà Laravel chờ (`PYTHON_ADVISOR_TIMEOUT`). Người dùng chỉ thấy "Không kết
  # nối được service tư vấn AI", còn log Python thì dừng lặng lẽ.
  timeout_seconds: 18

  # Ngân sách cho CẢ lượt sinh, gồm lần gọi đầu và lần sinh lại. Hết ngân
  # sách thì bỏ lần sinh lại chứ không chờ tiếp: một câu trả lời dựng sẵn
  # đúng số liệu đến trong 20 giây tốt hơn một câu hay hơn đến sau khi
  # Laravel đã ngắt kết nối.
  budget_seconds: 32
